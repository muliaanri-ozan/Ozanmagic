<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: #000000; color: #ffffff;
            margin: 0; padding: 20px; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .screen { display: none; height: 90vh; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .active { display: flex; }
        
        /* Menu 1: Baterai */
        .battery-box { font-size: 64px; font-weight: 300; margin-top: 20px; }
        
        /* Menu 2: Memori */
        .storage-container { width: 100%; max-width: 350px; text-align: left; background: #1c1c1e; padding: 20px; border-radius: 12px; }
        .storage-bar-bg { background: #3a3a3c; height: 8px; border-radius: 4px; overflow: hidden; margin: 15px 0; }
        .storage-bar-fill { background: #ffcc00; height: 100%; width: 95%; transition: width 0.5s ease; }
        
        /* Menu 3: Kamera */
        #screen-camera { padding: 0; justify-content: space-between; height: 100vh; }
        .viewfinder { flex: 1; width: 100%; background: #111; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .controls { height: 120px; display: flex; align-items: center; justify-content: center; background: #000; width: 100%; }
        .shutter-btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .shutter-inner { width: 58px; height: 58px; border-radius: 50%; background: white; }

        /* Menu 4: Galeri */
        #screen-gallery { justify-content: flex-start; padding: 0; align-items: stretch; }
        .gallery-header { display: flex; justify-content: space-between; padding: 16px 20px; font-size: 34px; font-weight: bold; }
        .gallery-sub { padding: 0 20px 10px 20px; font-size: 13px; color: #8e8e93; text-align: left; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 2px; }
        .grid-item { aspect-ratio: 1/1; background: #1c1c1e; overflow: hidden; cursor: pointer; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }
        
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
        #lightbox img { max-width: 95%; max-height: 85vh; border-radius: 4px; }
        .secret-download { position: fixed; bottom: 15px; right: 15px; width: 35px; height: 35px; opacity: 0.1; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- SCREEN 1: BATERAI -->
    <div id="screen-battery" class="screen active">
        <div style="font-size: 20px; color: #8e8e93;">Battery Health</div>
        <div class="battery-box" id="battery-display">100%</div>
    </div>

    <!-- SCREEN 2: MEMORI -->
    <div id="screen-memory" class="screen">
        <div class="storage-container">
            <div style="font-size: 15px; font-weight: 600;">iPhone Storage</div>
            <div id="storage-text" style="font-size: 13px; color: #8e8e93; margin-top: 5px;">Used of <span id="max-storage">128 GB</span></div>
            <div class="storage-bar-bg">
                <div id="storage-fill" class="storage-bar-fill"></div>
            </div>
            <div id="available-text" style="font-size: 12px; color: #8e8e93; text-align: right;">11 GB available</div>
        </div>
    </div>

    <!-- SCREEN 3: KAMERA -->
    <div id="screen-camera" class="screen">
        <div class="viewfinder">
            <video id="cam" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        <div class="controls">
            <div class="shutter-btn" onclick="capturePhoto()"><div class="shutter-inner"></div></div>
        </div>
    </div>

    <!-- SCREEN 4: GALERI -->
    <div id="screen-gallery" class="screen" style="text-align: left;">
        <div class="gallery-header">Library</div>
        <div class="gallery-sub" id="gal-count">1 Item</div>
        <div class="grid">
            <div class="grid-item" onclick="openPhoto()">
                <img id="selfie-result" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Selfie">
            </div>
        </div>
        <div class="secret-download" onclick="downloadPhoto()">
            <div style="width:14px; height:4px; border-top:2px solid white; border-bottom:2px solid white;"></div>
        </div>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script>
        // Menggunakan wss:// agar aman di Render.com
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(protocol + window.location.host + '/ws');

        let cameraStream = null;

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Ganti layar aktif sesuai perintah remote
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + data.screen).classList.add('active');

            if (data.action === "set_battery") {
                const disp = document.getElementById('battery-display');
                let drop = data.battery_target - 5;
                if (drop < 1) drop = 1;
                disp.innerText = drop + "%";
            } 
            else if (data.action === "trigger_ok_battery") {
                runCustomBatteryAnimation(data.battery_target);
            } 
            else if (data.screen === 'memory') {
                runMemoryAnimation(data.memory_target);
            } 
            else if (data.screen === 'camera') {
                startCamera();
            }
        };

        function runCustomBatteryAnimation(target) {
            const disp = document.getElementById('battery-display');
            let current = target - 4;
            setTimeout(() => {
                let interval = setInterval(() => {
                    if (current <= target) {
                        disp.innerText = current + "%";
                        current++;
                    } else {
                        clearInterval(interval);
                    }
                }, 2000);
            }, 3000);
        }

        function runMemoryAnimation(initialText) {
            const availText = document.getElementById('available-text');
            const fillBar = document.getElementById('storage-fill');
            availText.innerText = initialText + " available";
            fillBar.style.width = "85%";

            setTimeout(() => {
                availText.innerText = "4 GB available";
                fillBar.style.width = "40%";
                setTimeout(() => {
                    availText.innerText = "800 MB available";
                    fillBar.style.width = "15%";
                    setTimeout(() => {
                        availText.innerText = "5 MB available";
                        fillBar.style.width = "2%";
                    }, 1000);
                }, 1000);
            }, 3000);
        }

        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                document.getElementById('cam').srcObject = cameraStream;
            } catch(e) { 
                alert("Izin kamera diperlukan untuk trik ini!");
                console.log(e); 
            }
        }

        function capturePhoto() {
            const video = document.getElementById('cam');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            document.getElementById('selfie-result').src = canvas.toDataURL('image/jpeg');
            if(navigator.vibrate) navigator.vibrate(100);
        }

        function openPhoto() {
            document.getElementById('lightbox-img').src = document.getElementById('selfie-result').src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function downloadPhoto() {
            const a = document.createElement('a');
            a.href = document.getElementById('selfie-result').src;
            a.download = 'Magic-Selfie.jpg';
            a.click();
        }
    </script>
</body>
</html>
