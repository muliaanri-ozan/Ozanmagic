<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ozan Magic Controller</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #111; color: white; padding: 20px; text-align: center; }
        .box { background: #222; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        button { background: #0a84ff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; }
        input { width: 80%; padding: 10px; font-size: 18px; border-radius: 6px; border: 1px solid #444; background: #000; color: white; text-align: center; margin-top: 5px; }
        .nav-btn { background: #30d158; margin-top: 5px; }
        .ok-btn { background: #ff9f0a; }
    </style>
</head>
<body>
    <h2>🎩 OZAN MAGIC REMOTE</h2>

    <!-- Navigasi Menu Tampilan -->
    <div class="box">
        <h3>Pilih Menu Tampilan</h3>
        <button class="nav-btn" onclick="setScreen('battery')">1. Indikator Baterai</button>
        <button class="nav-btn" onclick="setScreen('memory')">2. Indikator Memori</button>
        <button class="nav-btn" onclick="setScreen('camera')">3. Kamera Palsu</button>
        <button class="nav-btn" onclick="setScreen('gallery')">4. Galeri (1 Foto)</button>
    </div>

    <!-- Kontrol Baterai -->
    <div class="box">
        <h3>Battery Health</h3>
        <input type="number" id="bat-val" value="80">
        <button onclick="sendBatteryTarget()">KIRIM TARGET (Set ke -5%)</button>
        <button class="ok-btn" onclick="sendBatteryOk()">OK (Jeda 3s & Naik 2s)</button>
    </div>

    <!-- Kontrol Memori -->
    <div class="box">
        <h3>Atur Sisa Memori Awal</h3>
        <input type="text" id="mem-val" value="11 GB">
        <button onclick="sendMemory()">PROSES MENYUSUT (OK)</button>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(protocol + window.location.host + '/ws');

        ws.onopen = function() {
            console.log("WebSocket Controller Connected");
        };

        function setScreen(name) {
            ws.send(JSON.stringify({ screen: name, action: 'switch_screen' }));
        }

        function sendBatteryTarget() {
            let val = parseInt(document.getElementById('bat-val').value) || 80;
            ws.send(JSON.stringify({ screen: 'battery', action: 'set_battery', battery_target: val }));
        }

        function sendBatteryOk() {
            let val = parseInt(document.getElementById('bat-val').value) || 80;
            ws.send(JSON.stringify({ screen: 'battery', action: 'trigger_ok_battery', battery_target: val }));
        }

        function sendMemory() {
            let val = document.getElementById('mem-val').value;
            ws.send(JSON.stringify({ screen: 'memory', action: 'set_memory', memory_target: val }));
        }
    </script>
</body>
</html>
