<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Magic Master Remote</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #000; color: white; padding: 20px; text-align: center; }
        h1 { color: #ff3b30; font-size: 22px; margin-top: 15px; }
        .card { background-color: #1c1c1e; padding: 20px; border-radius: 14px; margin-bottom: 20px; text-align: left; }
        label { font-size: 14px; color: #8e8e93; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; font-size: 24px; background-color: #2c2c2e; color: white; box-sizing: border-box; border-radius: 10px; border: none; text-align: center; margin-bottom: 15px; }
        button { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; background-color: #007aff; color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 5px; }
        button:active { background-color: #005bb5; }
        .btn-danger { background-color: #ff3b30; }
        .btn-danger:active { background-color: #c52d24; }
    </style>
</head>
<body>

    <h1>🎩 OZAN MAGIC REMOTE</h1>

    <!-- Menu Kontrol 1: Baterai -->
    <div class="card">
        <label>TARGET BATTERY HEALTH (Maks 100%):</label>
        <input type="number" id="target-battery" value="85" min="1" max="100">
        <button onclick="triggerBattery()">EXECUTE: NAIKKAN BATERAI</button>
    </div>

    <!-- Menu Kontrol 2: Sedot Memori Storage -->
    <div class="card">
        <label>AKSI SULAP BERIKUTNYA:</label>
        <button class="btn-danger" onclick="triggerMemory()">EXECUTE: SEDOT MEMORI</button>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(protocol + window.location.host + '/ws');

        function triggerBattery() {
            let targetVal = parseInt(document.getElementById("target-battery").value);
            if (targetVal > 100) targetVal = 100;
            if (targetVal < 1) targetVal = 1;
            
            const command = {
                action: "INCREASE_BATTERY",
                target: targetVal
            };
            ws.send(JSON.stringify(command));
            if (navigator.vibrate) navigator.vibrate(200); 
        }

        function triggerMemory() {
            // Perintah gaib untuk menyedot memori di halaman storage
            const command = { action: "DRAIN_MEMORY" };
            ws.send(JSON.stringify(command));
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
    </script>
</body>
</html>
